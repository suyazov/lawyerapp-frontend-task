name: Kimi Policy Gate
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: read
jobs:
  policy-gate:
    name: Kimi Policy Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PR identity
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          [[ "$HEAD_REF" == kimi/TASK-* ]] || exit 0
          task_id="${HEAD_REF#kimi/}"
          mapfile -t files < <(find tasks -maxdepth 1 -type f -name "${task_id}-*.md" -print)
          [ "${#files[@]}" -eq 1 ]
          file="${files[0]}"
          grep -Eq "^task_id:[[:space:]]*${task_id}$" "$file"
          grep -Eq "^branch:[[:space:]]*kimi/${task_id}$" "$file"
          grep -Eq '^model:[[:space:]]*kimi-code/k3$' "$file"
          grep -Eq '^status:[[:space:]]*(review|done)$' "$file"
