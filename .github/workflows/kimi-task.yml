name: Run Kimi Task
on:
  push:
    branches: [main]
    paths: ["tasks/ACTIVE.md", "tasks/TASK-*.md", "AGENTS.md", "scripts/**"]
  workflow_dispatch:
concurrency:
  group: kimi-project-${{ github.repository }}
  cancel-in-progress: false
permissions: {contents: write, pull-requests: write}
jobs:
  run-kimi:
    runs-on: [self-hosted, linux, x64, kimi]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - id: task
        run: ./scripts/read-active-task.sh
      - if: steps.task.outputs.status == 'ready' && steps.task.outputs.runnable != 'true'
        run: exit 1
      - if: steps.task.outputs.runnable == 'true'
        env: {GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}", KIMI_MODEL: kimi-code/k3}
        run: ./scripts/run-kimi-task.sh
